services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payload}
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-payload} -d $${POSTGRES_DB:-payload}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-payload}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-payload-secret}
    command: ["/data"]
    ports: ["${S3_PORT:-9000}:9000", "${S3_CONSOLE_PORT:-9001}:9001"]
    volumes: ["rustfs-data:/data"]
  caddy:
    image: caddy:2
    environment:
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:3000}
      CMS_UPSTREAM: ${CMS_UPSTREAM:-host.docker.internal:3001}
    ports: ["${PROXY_PORT:-8888}:8888"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  postgres-data:
  rustfs-data:
