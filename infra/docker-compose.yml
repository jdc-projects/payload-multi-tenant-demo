services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: payload
      RUSTFS_SECRET_KEY: payload-secret
    command: ["/data"]
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rustfs-data:/data"]
volumes:
  postgres-data:
  rustfs-data:
